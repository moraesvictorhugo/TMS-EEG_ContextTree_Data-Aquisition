[project]
name = "tms-eeg-contexttree"
version = "1.0.0"
description = "TMS-EEG experiment controller with context-tree stimulus sequences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bidict>=0.23",
    "keyboard>=0.13",
    "magicpy>=0.1.6",
    "numpy>=2.0",
    "pandas>=2.0",
    "pillow>=12.0",
    "pyautogui>=0.9",
    "pyserial>=3.5",
    "python-socketio>=5.0",
]

[project.scripts]
tms-eeg = "tms_eeg.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tms_eeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
